<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Project Management</title>
    <link rel="stylesheet" href="{% static 'myapp/login.css' %}">
</head>
<body>
<div class="login-container">
    <h2>Create Account</h2>

    {% if error %}<p class="error">{{ error }}</p>{% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="{{ username|default:'' }}" required autofocus>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>

        <label for="confirm">Confirm password:</label>
        <input type="password" id="confirm" name="confirm" required>

        <button type="submit">Register</button>
    </form>
    <p style="text-align:center; margin-top:15px;">
        Already have an account? <a href="{% url 'login' %}" style="color:#3498db; padding:0;">Login</a>
    </p>
</div>
</body>
</html>
