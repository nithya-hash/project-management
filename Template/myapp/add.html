<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>
    <link rel="stylesheet" href="{% static 'myapp/styles.css' %}">
</head>
<body>
    <div class="container form-container">
        <h1>Add Project</h1>

        {% if error %}<p class="form-error">{{ error }}</p>{% endif %}

        <form method="post" action="{% url 'insert' %}" class="study-form">
            {% csrf_token %}

            <label for="sid">Project id <small>(optional, leave blank to auto-generate)</small></label>
            <input type="number" id="sid" name="sid" min="1">

            <label for="sname">Project name</label>
            <input type="text" id="sname" name="sname" maxlength="100" required>

            <label for="sdesc">Description</label>
            <textarea id="sdesc" name="sdesc" rows="3"></textarea>

            <label for="sphase">Phase</label>
            <select id="sphase" name="sphase" required>
                <option value="Planning">Planning</option>
                <option value="Development">Development</option>
                <option value="Testing">Testing</option>
                <option value="Deployment">Deployment</option>
            </select>

            <label for="spon">Sponsor name</label>
            <input type="text" id="spon" name="spon" maxlength="100" required>

            <label for="sstatus">Status</label>
            <select id="sstatus" name="sstatus">
                <option value="Planned">Planned</option>
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>
            </select>

            <label for="sstart">Start date</label>
            <input type="date" id="sstart" name="sstart">

            <label for="send">End date</label>
            <input type="date" id="send" name="send">

            <div class="buttons">
                <button type="submit" class="btn">Add Project</button>
                <a href="{% url 'home' %}" class="btn btn-grey">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
