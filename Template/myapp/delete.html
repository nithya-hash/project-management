<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Delete Project</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 80px auto;
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 { margin-bottom: 20px; color: #d32f2f; }
        .delete-warning { font-size: 18px; margin-bottom: 30px; color: #333; }
        strong { color: #d32f2f; }
        .buttons { display: flex; justify-content: center; gap: 15px; }
        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            color: #fff;
            background-color: #7f8c8d;   /* new: makes Cancel visible */
        }
        .btn:hover { background-color: #6c7a7b; }
        .btn-delete { background-color: #d32f2f; }
        .btn-delete:hover { background-color: #b71c1c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Confirm Delete Project</h1>
        <p class="delete-warning">Are you sure you want to delete the project: <strong>"{{ study.name }}"</strong>?</p>
        <form method="post" class="delete-form">
            {% csrf_token %}
            <div class="buttons">
                <input type="submit" value="Confirm Delete" class="btn btn-delete">
                <a href="{% url 'home' %}" class="btn">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
